name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  create:
    tags:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Dependencies
        run: dotnet restore
      - name: Test
        run: dotnet test

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build ScrapeBuddy.csproj --no-restore
      - name: Upload Build Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v3
        with:
          name: ScrapeBuddy-linux-${{ github.ref_name }}
          path: bin/Debug/net8.0/
  
  build-windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build ScrapeBuddy.csproj --runtime win-x64  --no-restore
      - name: Upload Build Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v3
        with:
          name: ScrapeBuddy-windows-${{ github.ref_name }}
          path: bin/Debug/net8.0/win-x64/


  documentation:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate Documentation
        run: doxygen docs/Doxyfile.txt
      - name: Upload Documentation
        uses: actions/upload-artifact@v3
        with:
          name: Documentation
          path: docs/html/*
  
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: ScrapeBuddy-linux-${{ env.TAG_NAME }}
          path: build-artifacts-linux
      - uses: actions/checkout@v4
      - name: Download Windows Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: ScrapeBuddy-windows-${{ env.TAG_NAME }}
          path: build-artifacts-windows/
      - name: Make ScrapeBuddy executable (Linux)
        run: chmod 777 build-artifacts-linux/ScrapeBuddy
      - name: Zip Binaries Linux
        run: |
          cd build-artifacts-linux/
          ls -la
          echo "Tag name: $TAG_NAME"
          zip -r ScrapeBuddy-linux-$TAG_NAME.zip .
          ls -la
      - name: Zip Binaries Windows
        run: |
          cd build-artifacts-windows/
          ls -la
          echo "Tag name: $TAG_NAME"
          zip -r ScrapeBuddy-windows-$TAG_NAME.zip .
          ls -la
      - name: Release to Github
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files:  |
            build-artifacts-windows/ScrapeBuddy-windows-${{ env.TAG_NAME }}.zip 
            build-artifacts-linux/ScrapeBuddy-linux-${{ env.TAG_NAME }}.zip
          
  

